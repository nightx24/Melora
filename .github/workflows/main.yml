name: "Build Android"

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: melora-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-android:
    name: Build Android (Temporary Debug)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.4'
          channel: stable
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Regenerate Dart Code
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Extract version
        shell: bash
        run: |
          VERSION="$(awk '/^version:/ {print $2; exit}' pubspec.yaml | cut -d+ -f1)"
          test -n "$VERSION"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Build Android debug APKs
        run: flutter build apk --debug --split-per-abi --build-number "${{ github.run_number }}"

      - name: Verify APKs
        run: |
          for apk in \
            build/app/outputs/flutter-apk/app-armeabi-v7a-debug.apk \
            build/app/outputs/flutter-apk/app-arm64-v8a-debug.apk \
            build/app/outputs/flutter-apk/app-x86_64-debug.apk; do
            test -f "$apk"
          done

      - name: Rename APKs
        run: |
          cd build/app/outputs/flutter-apk
          mv app-armeabi-v7a-debug.apk "melora_debug_v${{ env.VERSION }}+${{ github.run_number }}_armeabi-v7a.apk"
          mv app-arm64-v8a-debug.apk "melora_debug_v${{ env.VERSION }}+${{ github.run_number }}_arm64-v8a.apk"
          mv app-x86_64-debug.apk "melora_debug_v${{ env.VERSION }}+${{ github.run_number }}_x86_64.apk"

      - name: Create build-number.txt
        run: echo "${{ github.run_number }}" > build-number.txt

      - name: Upload Android Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Debug-Android
          path: |
            build/app/outputs/flutter-apk/melora_debug_v${{ env.VERSION }}+${{ github.run_number }}_armeabi-v7a.apk
            build/app/outputs/flutter-apk/melora_debug_v${{ env.VERSION }}+${{ github.run_number }}_arm64-v8a.apk
            build/app/outputs/flutter-apk/melora_debug_v${{ env.VERSION }}+${{ github.run_number }}_x86_64.apk
            build-number.txt

      - name: Publish Android debug prerelease
        uses: ncipollo/release-action@v1
        with:
          artifacts: |
            build/app/outputs/flutter-apk/melora_debug_v${{ env.VERSION }}+${{ github.run_number }}_armeabi-v7a.apk
            build/app/outputs/flutter-apk/melora_debug_v${{ env.VERSION }}+${{ github.run_number }}_arm64-v8a.apk
            build/app/outputs/flutter-apk/melora_debug_v${{ env.VERSION }}+${{ github.run_number }}_x86_64.apk
            build-number.txt
          tag: debug-v${{ env.VERSION }}+${{ github.run_number }}
          token: ${{ github.token }}
          prerelease: true
          allowUpdates: true

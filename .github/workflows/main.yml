name: "Build & Release"

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build-android:
    name: Build Android
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.4'
          channel: stable
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Extract version
        shell: bash
        run: |
          VERSION="$(awk '/^version:/ {print $2; exit}' pubspec.yaml | cut -d+ -f1)"
          test -n "$VERSION"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Configure release signing
        env:
          KEY_STORE: ${{ secrets.KEY_STORE }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          if [[ -n "$KEY_STORE" && -n "$KEY_PASSWORD" && -n "$STORE_PASSWORD" && -n "$KEY_ALIAS" ]]; then
            echo "$KEY_STORE" | base64 --decode > android/bloomee.jks
            cat > android/key.properties <<EOF
          keyPassword=$KEY_PASSWORD
          storePassword=$STORE_PASSWORD
          keyAlias=$KEY_ALIAS
          EOF
            echo "Release signing configured."
          else
            echo "No complete release keystore configured; using the Gradle debug-signing fallback for this prerelease build."
          fi

      - name: Build Android
        run: flutter build apk --release --split-per-abi --build-number "${{ github.run_number }}"

      - name: Verify APKs
        run: |
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -1)"
          test -x "$APKSIGNER"
          for apk in             build/app/outputs/flutter-apk/app-release.apk             build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk             build/app/outputs/flutter-apk/app-arm64-v8a-release.apk             build/app/outputs/flutter-apk/app-x86_64-release.apk; do
            test -f "$apk"
            "$APKSIGNER" verify "$apk"
          done

      - name: Rename APKs
        run: |
          cd build/app/outputs/flutter-apk
          mv app-release.apk "melora_android_v${VERSION}+${{ github.run_number }}_universal.apk"
          mv app-armeabi-v7a-release.apk "melora_android_v${VERSION}+${{ github.run_number }}_armeabi-v7a.apk"
          mv app-arm64-v8a-release.apk "melora_android_v${VERSION}+${{ github.run_number }}_arm64-v8a.apk"
          mv app-x86_64-release.apk "melora_android_v${VERSION}+${{ github.run_number }}_x86_64.apk"

      - name: Create build-number.txt
        run: echo "${{ github.run_number }}" > build-number.txt

      - name: Upload Android Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Release-Android
          path: |
            build/app/outputs/flutter-apk/melora_android_v${{ env.VERSION }}+${{ github.run_number }}_universal.apk
            build/app/outputs/flutter-apk/melora_android_v${{ env.VERSION }}+${{ github.run_number }}_armeabi-v7a.apk
            build/app/outputs/flutter-apk/melora_android_v${{ env.VERSION }}+${{ github.run_number }}_arm64-v8a.apk
            build/app/outputs/flutter-apk/melora_android_v${{ env.VERSION }}+${{ github.run_number }}_x86_64.apk
            build-number.txt

      - name: Publish Android prerelease
        uses: ncipollo/release-action@v1
        with:
          artifacts: |
            build/app/outputs/flutter-apk/melora_android_v${{ env.VERSION }}+${{ github.run_number }}_universal.apk
            build/app/outputs/flutter-apk/melora_android_v${{ env.VERSION }}+${{ github.run_number }}_armeabi-v7a.apk
            build/app/outputs/flutter-apk/melora_android_v${{ env.VERSION }}+${{ github.run_number }}_arm64-v8a.apk
            build/app/outputs/flutter-apk/melora_android_v${{ env.VERSION }}+${{ github.run_number }}_x86_64.apk
            build-number.txt
          tag: v${{ env.VERSION }}+${{ github.run_number }}
          token: ${{ github.token }}
          prerelease: true
          allowUpdates: true

  build-linux:
    name: Build Linux
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.4'
          channel: stable
          cache: true

      - name: Install Linux Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake git ninja-build pkg-config libgtk-3-dev liblzma-dev libstdc++-12-dev

      - name: Install Dependencies
        run: flutter pub get

      - name: Extract version
        run: |
          VERSION="$(awk '/^version:/ {print $2; exit}' pubspec.yaml | cut -d+ -f1)"
          test -n "$VERSION"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Build Linux
        run: flutter build linux --release --build-number "${{ github.run_number }}"

      - name: Compress Linux Build
        run: tar -czf "melora_linux_x64_v${VERSION}+${{ github.run_number }}.tar.gz" -C build/linux/x64/release/bundle .

      - name: Upload Linux Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Release-Linux
          path: melora_linux_x64_v${{ env.VERSION }}+${{ github.run_number }}.tar.gz

      - name: Publish Linux prerelease
        uses: ncipollo/release-action@v1
        with:
          artifacts: melora_linux_x64_v${{ env.VERSION }}+${{ github.run_number }}.tar.gz
          tag: v${{ env.VERSION }}+${{ github.run_number }}
          token: ${{ github.token }}
          prerelease: true
          allowUpdates: true
          omitBodyDuringUpdate: true
